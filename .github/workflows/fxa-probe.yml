name: FxA edge probe
on:
  push:
    paths:
      - ".github/fxa-probe/**"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the account API what it thinks of us
        run: |
          FIREFOX_UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0'
          out=""
          for mode in "h1 --http1.1" "h2 --http2"; do
            set -- $mode
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$2" -A "$FIREFOX_UA" \
              -H 'Content-Type: application/json' --data '{"email":"nobody@example.com","authPW":"00"}' \
              https://api.accounts.firefox.com/v1/account/login || true)
            out="$out $1=$code"
          done
          site=$(curl -s -m 20 -A "$FIREFOX_UA" https://accounts.firefox.com/ | grep -c '_fs-ch-' || true)
          token=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -A "$FIREFOX_UA" -H 'Accept-Encoding: identity' \
            -H 'Content-Type: application/json' --data '{"client_id":"5882386c6d801776","grant_type":"refresh_token","refresh_token":"x"}' \
            https://oauth.accounts.firefox.com/v1/token || true)
          echo "::notice::site-challenge-marks=$site token-endpoint=$token$out"
      - name: Run the challenge solver
        run: |
          python3 -m pip install --quiet requests
          python3 .github/fxa-probe/solve.py
