name: Build RX VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set (e.g. v1.0.0), the APKs are published as a GitHub Release"
        required: false
        type: string
      draft:
        description: "Create the release as a draft, visible only to you (test builds)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - main
      - "arena/**"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "30.0.16248370"

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AndroidLibXrayLite (core version source)
        run: git submodule update --init --recursive AndroidLibXrayLite

      - name: Checkout hev-socks5-tunnel (tun2socks source)
        run: git submodule update --init --recursive hev-socks5-tunnel

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Accept licenses and install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Inject NDK version into the Gradle build
        run: |
          if ! grep -q "ndkVersion" V2rayNG/app/build.gradle.kts; then
            sed -i "s|    compileSdk = 37|    compileSdk = 37\n    ndkVersion = \"${ANDROID_NDK_VERSION}\"|" V2rayNG/app/build.gradle.kts
          fi
          grep -n "ndkVersion" V2rayNG/app/build.gradle.kts

      - name: Restore cached tun2socks libraries
        id: cache-libhevtun
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build tun2socks libraries (hev-socks5-tunnel)
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Cache tun2socks libraries
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy native libraries into the app module
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/

      # ---- Aether engine (optional) ------------------------------------------------------
      # Built from source once and cached. Every step may fail without failing the build:
      # the app then simply reports that Aether is not included.
      - name: Restore cached Aether engine
        id: cache-aether
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs-aether
          key: aether-engine-${{ runner.os }}-${{ hashFiles('build-aether.sh') }}

      - name: Install toolchain for the Aether engine
        if: steps.cache-aether.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" > /dev/null
          echo "AETHER_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build the Aether engine
        id: build-aether
        if: steps.cache-aether.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          set -o pipefail
          bash build-aether.sh 2>&1 | tee "$RUNNER_TEMP/aether-build.log" | tail -n 400

      - name: Surface Aether build errors
        if: steps.cache-aether.outputs.cache-hit != 'true' && steps.build-aether.outcome != 'success'
        continue-on-error: true
        run: |
          rm -rf libs-aether
          echo "::warning::Aether engine was not built; this APK ships without it."
          if [ -f "$RUNNER_TEMP/aether-build.log" ]; then
            grep -nE "^error|ERROR|error:|panicked|No such file|not found|failed" "$RUNNER_TEMP/aether-build.log" | tail -n 25 | while IFS= read -r line; do
              echo "::warning::${line}"
            done
          fi

      - name: Cache Aether engine
        if: steps.cache-aether.outputs.cache-hit != 'true' && steps.build-aether.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs-aether
          key: aether-engine-${{ runner.os }}-${{ hashFiles('build-aether.sh') }}

      - name: Copy the Aether engine into the app module
        run: |
          if [ -f libs-aether/arm64-v8a/libaether.so ]; then
            SYSROOT_LIB="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              mkdir -p "V2rayNG/app/libs/${abi}"
              cp libs-aether/${abi}/*.so "V2rayNG/app/libs/${abi}/"
              case "$abi" in
                arm64-v8a)   triple="aarch64-linux-android" ;;
                armeabi-v7a) triple="arm-linux-androideabi" ;;
                x86_64)      triple="x86_64-linux-android" ;;
              esac
              if [ -f "V2rayNG/app/libs/${abi}/libc++_shared.so" ] && [ -f "${SYSROOT_LIB}/${triple}/libc++_shared.so" ]; then
                cp "${SYSROOT_LIB}/${triple}/libc++_shared.so" "V2rayNG/app/libs/${abi}/libc++_shared.so"
              fi
            done
            # Verify all undefined symbols of libaether.so against NDK 30 libc++_shared.so (when needed)
            LLVM_NM=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | head -1)
            if [ -f "V2rayNG/app/libs/arm64-v8a/libc++_shared.so" ]; then
              "$LLVM_NM" -D --defined-only "V2rayNG/app/libs/arm64-v8a/libc++_shared.so" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/libcxx_syms.txt"
              MISSING=$("$LLVM_NM" -D --undefined-only "V2rayNG/app/libs/arm64-v8a/libaether.so" | awk '{print $NF}' | grep '^_Z.*__ndk1' | grep -vxFf "$RUNNER_TEMP/libcxx_syms.txt" || true)
              if [ -n "$MISSING" ]; then
                echo "::warning::Missing NDK C++ symbols in NDK 30 libc++_shared.so: $MISSING"
              fi
            fi
            echo "Aether engine included (commit $(cat libs-aether/AETHER_COMMIT))"
            ls -la V2rayNG/app/libs/arm64-v8a
          else
            echo "::warning::No Aether engine in this build."
          fi

      - name: Resolve Xray core version
        run: |
          cd AndroidLibXrayLite
          git fetch --tags --force --depth 1 origin "+refs/tags/*:refs/tags/*" || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          fi
          echo "Using AndroidLibXrayLite $TAG"
          echo "CORE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CORE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray.aar (Xray core engine)
        run: |
          mkdir -p V2rayNG/app/libs
          curl -fL --retry 3 \
            -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CORE_TAG}/libv2ray.aar"
          ls -lh V2rayNG/app/libs/

      - name: Validate UI, resources, and both distribution flavors
        run: |
          cd V2rayNG
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon \
            :app:testPlaystoreDebugUnitTest \
            :app:compilePlaystoreDebugKotlin \
            :app:assemblePlaystoreDebug \
            :app:assembleFdroidDebug 2>&1 | tee "$RUNNER_TEMP/rx-validation.log"

      - name: Surface validation errors
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "rx-validation.log")
          if os.path.exists(path):
              for line in open(path, encoding="utf-8", errors="replace"):
                  if line.startswith("e:") or "FAILED" in line or line.startswith("Caused by:"):
                      print("::error::" + line.strip().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYEOF

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          # Android only installs an update when the signature is unchanged, so there is exactly
          # one key, for ever. It lives only in the repository secrets, never in the repository:
          # a public key file lets anyone sign a fake app as RX VPN. There is no fallback on
          # purpose - a build without the key must fail instead of shipping another signature.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret APP_KEYSTORE_BASE64 is not set. Add the RX VPN signing key under Settings > Secrets and variables > Actions."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/rxvpn.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          STORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rxvpn
          KEY_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          # Build unsigned; sign below with jarsigner v1-only for maximum install compatibility.
          ./gradlew --no-daemon assemblePlaystoreRelease :app:assemblePlaystoreDebug \
            -Prx.versionCode="$((4000004 + GITHUB_RUN_NUMBER))" \
            -Prx.versionName="1.2.1"

      - name: Show outputs
        run: find V2rayNG/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Sign APKs (v1+v2+v3)
        env:
          STORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rxvpn
          KEY_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          # Broad install/update compatibility: sign with v1+v2+v3.
          # apksigner skips v1 when manifest minSdk>=24; override min-sdk to 21 so
          # v1 is included while keeping v2/v3 for modern Android.
          # Order for apksigner: zipalign first, then sign.
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          for apk in V2rayNG/app/build/outputs/apk/playstore/release/*.apk \
                     V2rayNG/app/build/outputs/apk/playstore/debug/*.apk; do
            echo "== sign $apk"
            zip -d "$apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.MF' 2>/dev/null || true
            ZA_OUT=$("$ZIPALIGN" -f -p 4 "$apk" "$apk.aligned" 2>&1) || {
              echo "$ZA_OUT"
              echo "::error::zipalign failed for $apk: ${ZA_OUT//$'\n'/ }"
              exit 1
            }
            mv "$apk.aligned" "$apk"
            "$APKSIGNER" sign \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$apk"
            VERIFY=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || true
            echo "$VERIFY" | head -20
            for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" "v3 scheme (APK Signature Scheme v3): true"; do
              echo "$VERIFY" | grep -q "$scheme" || {
                DETAIL=$(echo "$VERIFY" | head -12 | tr '\n' ' ' | sed 's/"/'\''/g')
                echo "::error::$apk missing $scheme: $DETAIL"
                exit 1
              }
            done
          done

      - name: Verify signing certificate
        env:
          EXPECTED_SHA256: "845b7323f50757566efeda24c07a6c4f732821d1ee473fbc1ec27998acf39ab8"
        run: |
          # Guards the in-place-update promise: a different certificate means every user would
          # have to uninstall before installing this build.
          APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a.apk | head -1)
          echo "Checking $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "$EXPECTED_SHA256" "$RUNNER_TEMP/certs.txt" || {
            echo "::error::APK is not signed with the RX VPN release key; in-place updates would fail"
            exit 1
          }
          echo "Signing certificate matches the RX VPN release key."
          # Every file a tester can get from this run must update every other one in place.
          for other in V2rayNG/app/build/outputs/apk/playstore/release/*.apk \
                       V2rayNG/app/build/outputs/apk/playstore/debug/*.apk; do
            "$BUILD_TOOLS/apksigner" verify --print-certs "$other" | grep -qi "$EXPECTED_SHA256" || {
              echo "::error::$other is not signed with the RX VPN release key"
              exit 1
            }
          done
          echo "All release and debug APKs carry the same certificate."

      - name: Refuse an APK that a phone cannot update
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          # 4000004 is the highest versionCode any earlier build carries, so anything
          # above it is newer than everything that came before. A file at or below it
          # would install on a clean phone and silently refuse to update one that has
          # RX VPN on it already - which is the report this step exists to make
          # impossible to ship again.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in *.apk; do
            CODE=$("$BUILD_TOOLS/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            NAME=$("$BUILD_TOOLS/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            echo "$apk: versionCode=$CODE versionName=$NAME"
            if [ -z "$CODE" ] || [ "$CODE" -le 4000004 ]; then
              echo "::error::$apk carries versionCode ${CODE:-none}; it must be greater than 4000004 or a phone with RX VPN installed will not take it."
              exit 1
            fi
          done

      - name: Report APK facts
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          # Every fact that decides whether a phone accepts the package, in one block.
          # A check-run annotation only keeps the first line of a step's own output, so
          # the facts are also written to the job summary, where nothing is truncated.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "## APK facts"
            echo '```'
            for apk in *.apk; do
              echo "== $apk"
              "$BUILD_TOOLS/aapt2" dump badging "$apk" 2>/dev/null \
                | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:|^split:"
              "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" 2>&1 \
                | grep -E "Verified using|Number of signers|Signer #1 certificate SHA-256|WARNING"
              "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>/dev/null \
                | grep -icE "extractNativeLibs=..true" | sed -e "s/^/extractNativeLibs=true count: /"
            done
            echo '```'
          } | tee "$GITHUB_STEP_SUMMARY"
          # Emit at most 6 concise notices so GitHub does not drop any under the per-step cap.
          SAMPLE=$(ls RXVPN_*_arm64-v8a.apk | head -1)
          BADGE=$("$BUILD_TOOLS/aapt2" dump badging "$SAMPLE" 2>/dev/null \
            | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:" | tr '\n' ' ')
          echo "::notice title=badging::$SAMPLE $BADGE"
          EXTRACT_FLAG=$("$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$SAMPLE" 2>/dev/null \
            | grep -i "extractNativeLibs" | head -1 | xargs)
          echo "::notice title=manifest::$SAMPLE ${EXTRACT_FLAG:-extractNativeLibs_MISSING}"
          LIBS_SUMMARY=$(unzip -v "$SAMPLE" | grep -E "lib/arm64-v8a/" | awk '{print $8 ":" $3}' | tr '\n' ' ')
          echo "::notice title=nativelibs::$LIBS_SUMMARY"
          SIG_SUMMARY=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SAMPLE" 2>&1 \
            | grep -E "Verified using|Signer #1 certificate SHA-256" | tr '\n' ';')
          echo "::notice title=signature::$SIG_SUMMARY"
          # v1+v2+v3 for broad install/update compatibility across Android versions.
          VERIFY_ALL=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SAMPLE" 2>&1)
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" "v3 scheme (APK Signature Scheme v3): true"; do
            echo "$VERIFY_ALL" | grep -q "$scheme" || {
              echo "::error::$SAMPLE missing $scheme"
              exit 1
            }
          done
          # Compare against released v1.0.1 to confirm identical signing key and packaging shape.
          if curl -fsSL "https://github.com/kairomax1/RX_client/releases/download/v1.0.1/RXVPN_1.0.1_arm64-v8a.apk" -o "$RUNNER_TEMP/v101.apk"; then
            V101_SIG=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/v101.apk" 2>&1 \
              | grep -E "Verified using|Signer #1 certificate SHA-256" | tr '\n' ';')
            echo "::notice title=v1.0.1-sig::$V101_SIG"
          fi

      - name: Compare APK with v1.0.1
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SAMPLE=$(ls RXVPN_*_arm64-v8a.apk | head -1)
          V101="$RUNNER_TEMP/v101.apk"
          if [ -f "$V101" ]; then
            V101_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$V101" 2>&1 | grep "SHA-256 digest" | head -1 | xargs)
            V12_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$SAMPLE" 2>&1 | grep "SHA-256 digest" | head -1 | xargs)
            echo "::notice title=cert-compare::v101=[$V101_CERT] | v12=[$V12_CERT]"

            "$BUILD_TOOLS/aapt2" dump badging "$V101" 2>/dev/null > "$RUNNER_TEMP/v101.badge"
            "$BUILD_TOOLS/aapt2" dump badging "$SAMPLE" 2>/dev/null > "$RUNNER_TEMP/v12.badge"
            BADGE_DIFF=$(diff -u "$RUNNER_TEMP/v101.badge" "$RUNNER_TEMP/v12.badge" | grep -E "^[+-][^+-]" | tr '\n' '|' | head -c 900)
            echo "::notice title=badge-diff::$BADGE_DIFF"

            "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$V101" 2>/dev/null > "$RUNNER_TEMP/v101.xml"
            "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$SAMPLE" 2>/dev/null > "$RUNNER_TEMP/v12.xml"
            XML_DIFF=$(diff -u "$RUNNER_TEMP/v101.xml" "$RUNNER_TEMP/v12.xml" | grep -E "^[+-][^+-]" | grep -E "E: |name\(|icon\(|foregroundServiceType|process\(|extractNativeLibs" | tr '\n' '|' | head -c 900)
            echo "::notice title=manifest-diff::$XML_DIFF"

            unzip -Z1 "$V101" | sort > "$RUNNER_TEMP/v101.files"
            unzip -Z1 "$SAMPLE" | sort > "$RUNNER_TEMP/v12.files"
            ZIP_DIFF=$(comm -13 "$RUNNER_TEMP/v101.files" "$RUNNER_TEMP/v12.files" | grep -vE "^assets/|^res/|^classes" | tr '\n' '|' | head -c 900)
            echo "::notice title=new-nonasset-files::$ZIP_DIFF"

            Z_V101=$("$BUILD_TOOLS/zipalign" -c -p 4 "$V101" && echo OK || echo FAIL)
            Z_V12=$("$BUILD_TOOLS/zipalign" -c -p 4 "$SAMPLE" && echo OK || echo FAIL)
            echo "::notice title=zipalign-p::v101=$Z_V101 | v12=$Z_V12"
          fi
          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | head -1)
          mkdir -p "$RUNNER_TEMP/so_inspect"
          unzip -o -j "$SAMPLE" "lib/arm64-v8a/*" -d "$RUNNER_TEMP/so_inspect" > /dev/null
          ELF_INFO=""
          for f in "$RUNNER_TEMP/so_inspect"/*.so; do
            bn=$(basename "$f")
            tp=$("$READELF" -h "$f" 2>/dev/null | grep "Type:" | awk '{print $2}')
            al=$("$READELF" -l "$f" 2>/dev/null | grep "LOAD" | awk '{print $NF}' | sort -u | tr '\n' ',')
            it=$("$READELF" -l "$f" 2>/dev/null | grep -c "INTERP" || true)
            ELF_INFO="${ELF_INFO}${bn}(type=${tp},align=${al},interp=${it}); "
          done
          echo "::notice title=elf-check::$ELF_INFO"

      - name: Verify APK structure and write checksums
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          # apksigner proves the signature; these prove the file is a readable, aligned APK and
          # give the tester a hash to compare against what actually landed on the phone.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in *.apk; do
            echo "== $apk"
            "$BUILD_TOOLS/aapt2" dump badging "$apk" 2>/dev/null \
              | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:" \
              || { echo "::error::$apk is not a readable APK"; exit 1; }
            "$BUILD_TOOLS/zipalign" -c -v 4 "$apk" > /dev/null \
              || { echo "::error::$apk is not zip-aligned"; exit 1; }
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Collect APK facts
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          # These lines are copied into the release notes so the exact packaging of the shipped file
          # can be inspected later without downloading anything.
          set +e
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls RXVPN_*_arm64-v8a.apk | head -1)
          {
            echo '```'
            echo "== badging =="
            "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:"
            echo "== manifest flags =="
            "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -iE "extractNativeLibs|isFeatureSplit|split="
            echo "== signature schemes =="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -25
            echo "== zipalign -c -v 4 =="
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -3
            echo "== archive entries =="
            unzip -v "$APK" | grep -E "resources.arsc|classes.dex|lib/arm64-v8a/" | head -12
            echo "== end =="
            echo '```'
          } > APK-FACTS.txt 2>&1
          cat APK-FACTS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RXVPN-apk
          compression-level: 0
          path: |
            V2rayNG/app/build/outputs/apk/playstore/release/*.apk
            V2rayNG/app/build/outputs/apk/playstore/release/SHA256SUMS.txt
            V2rayNG/app/build/outputs/apk/playstore/release/APK-FACTS.txt
          if-no-files-found: error

      - name: Prepare direct APK and standard ZIP files
        working-directory: V2rayNG/app/build/outputs/apk/playstore/release
        run: |
          mkdir -p "$RUNNER_TEMP/direct"
          ARM64_APK=$(ls RXVPN_*_arm64-v8a.apk | head -1)
          UNI_APK=$(ls RXVPN_*_universal.apk | head -1)
          cp "$ARM64_APK" "$RUNNER_TEMP/direct/RXVPN_1.2_arm64-v8a.apk"
          cp "$UNI_APK" "$RUNNER_TEMP/direct/RXVPN_1.2_universal.apk"
          # Standard Info-ZIP (no Zip64, no streaming data descriptor) so built-in Android File Managers extract it cleanly.
          zip -0 -j "$RUNNER_TEMP/direct/RXVPN_1.2_arm64-v8a.zip" "$ARM64_APK"
          unzip -t "$RUNNER_TEMP/direct/RXVPN_1.2_arm64-v8a.zip"
          ls -lh "$RUNNER_TEMP/direct"

      - name: Upload direct arm64-v8a APK (no ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/direct/RXVPN_1.2_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload standard arm64-v8a ZIP (non-Zip64)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/direct/RXVPN_1.2_arm64-v8a.zip
          if-no-files-found: error

      - name: Upload direct universal APK (no ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/direct/RXVPN_1.2_universal.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only on request: a push to master builds and tests, it never publishes by itself.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: RXVPN-apk
          path: apk

      - name: List downloaded APKs
        run: ls -lh apk

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' V2rayNG/app/build.gradle.kts | head -1)
          TAG="${INPUT_TAG:-v${VERSION_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing RX VPN $TAG"

      - name: Write release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The release text is exactly .github/release-notes.md; nothing is appended to it.
          sed -e "s|@TAG@|${TAG}|g" -e "s|@SHA@|${GITHUB_SHA}|g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          head -5 "$RUNNER_TEMP/notes.md"

      - name: Publish APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # A draft stays private to the repository owner, so a test build never becomes public.
          if [ "$DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
            LATEST_FLAG=""
          else
            DRAFT_FLAG=""
            LATEST_FLAG="--latest"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" apk/*.apk apk/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" $DRAFT_FLAG
          else
            gh release create "$TAG" apk/*.apk apk/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RX VPN $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              $DRAFT_FLAG $LATEST_FLAG
          fi
