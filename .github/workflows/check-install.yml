name: Diagnose RX VPN installation
on:
  push:
    branches: [arena/8e7dbd45-rx-client]
    paths: [.github/workflows/check-install.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RXVPN-apk
          path: apk
          run-id: 44823591545
          github-token: ${{ github.token }}
      - name: Check exact build files
        working-directory: apk
        run: |
          sha256sum -c SHA256SUMS.txt
          for apk in *.apk; do unzip -tq "$apk"; done
      - name: Get previous public version for update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.1 -R "$GITHUB_REPOSITORY" -p '*_x86_64.apk' -D previous
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test clean install and update with Android Package Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install apk/*_x86_64.apk
            adb uninstall com.mobix.vpn
            adb install previous/*_x86_64.apk
            adb install -r apk/*_x86_64.apk
  stage-draft:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RXVPN-apk
          path: apk
          run-id: 44823591545
          github-token: ${{ github.token }}
      - name: Attach verified APKs to test draft only
        working-directory: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 44828108696 -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion | grep -Fx success
          sha256sum -c SHA256SUMS.txt
          gh release view v1.2-install-test -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -Fx true
          gh release upload v1.2-install-test -R "$GITHUB_REPOSITORY" RXVPN_1.2_{universal,arm64-v8a}.apk SHA256SUMS.txt --clobber
