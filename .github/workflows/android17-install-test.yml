name: Test Android 17 APK installation

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/android17-install-test.yml"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful build run that contains the RXVPN-apk artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android17:
    name: Fresh install and in-place update on Android 17 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate APKs
        uses: actions/download-artifact@v4
        with:
          name: RXVPN-apk
          path: apks/new
          run-id: ${{ github.event.inputs.artifact_run_id || '46127785552' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the previous public release for upgrade testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks/old
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern RXVPN_1.0.1_universal.apk --pattern RXVPN_1.0.1_arm64-v8a.apk \
            --dir apks/old
          ls -lh apks/new apks/old

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install fresh and update without removing user data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK=apks/new/RXVPN_1.2.1_universal.apk
            OLD=apks/old/RXVPN_1.0.1_universal.apk
            SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
            ABI=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
            echo "Android API $SDK; ABIs: $ABI"
            [ "$SDK" = "37" ] || { echo "Expected API 37, got $SDK"; exit 1; }

            echo 'Fresh-install test (universal APK)'
            adb install "$APK"
            adb shell dumpsys package com.mobix.vpn | grep -E 'versionCode=|versionName='
            adb uninstall com.mobix.vpn

            echo 'Upgrade test: install public 1.0.1, then update in place'
            adb install "$OLD"
            adb shell dumpsys package com.mobix.vpn | grep -E 'versionCode=|versionName='
            adb install -r "$APK"
            adb shell dumpsys package com.mobix.vpn | grep -E 'versionCode=|versionName='
            adb shell pm path com.mobix.vpn

            if echo "$ABI" | grep -q 'arm64-v8a'; then
              ARM64=apks/new/RXVPN_1.2.1_arm64-v8a.apk
              OLD_ARM64=apks/old/RXVPN_1.0.1_arm64-v8a.apk
              echo 'This emulator supports ARM64; also test the exact arm64-v8a APK'
              adb uninstall com.mobix.vpn
              adb install "$ARM64"
              adb shell dumpsys package com.mobix.vpn | grep -E 'versionCode=|versionName='
              adb uninstall com.mobix.vpn
              adb install "$OLD_ARM64"
              adb install -r "$ARM64"
              adb shell dumpsys package com.mobix.vpn | grep -E 'versionCode=|versionName='
            else
              echo '::warning::Emulator has no ARM64 native bridge; only the universal APK was installed'
            fi
