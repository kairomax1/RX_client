name: Probe service addresses
on:
  push:
    paths:
      - ".github/probe/**"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status of each address from outside Iran
        run: |
          while read -r entry; do
            [ -z "$entry" ] && continue
            code=$(curl -s -o /dev/null -m 10 --http1.1 -A 'Mozilla/5.0' -H 'Accept: */*' -w '%{http_code}' "https://$entry" || true)
            echo "RESULT $entry $code"
          done < .github/probe/hosts.txt
